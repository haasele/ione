name: Release desktop packages

# Builds every supported package for a v* tag, then publishes them with SHA256SUMS.txt,
# update-manifest.json (signed when UPDATE_MANIFEST_SIGNING_KEY exists) and the updater feeds.
# workflow_dispatch runs the packaging without creating a release, which is the way to test a
# packaging change. The build matrix lives in the reusable package-desktop.yml workflow, shared
# with the nightly channel.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: build jobs only read the repository. The release job below raises this
# to contents: write for the tag upload.
permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read package.json version and check the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME must be $tag (the version in package.json)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: prepare
    uses: ./.github/workflows/package-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
    secrets: inherit

  release:
    name: Publish GitHub release
    # workflow_dispatch runs stop at the artifacts; only a v* tag publishes.
    if: github.ref_type == 'tag'
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ione-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS.txt' \
              ! -name 'update-manifest.json' \
              ! -name 'update-manifest.json.sig' \
              -printf '%f\0' | LC_ALL=C sort -z
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files to checksum"
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt

      - name: Generate update-manifest.json
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: haasele/ione
          COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DIST_DIR: release
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: node .github/scripts/update-manifest.mjs

      - name: Create or update the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--draft --generate-notes --title "Ione $VERSION" --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
