name: Package desktop and Android builds

# Reusable packaging workflow. The caller supplies the version to stamp into package.json (the
# version of a v* tag, or `<base>-nightly.<run>` for the nightly channel) and receives the
# installers, electron-updater feeds and Android APK as workflow artifacts. Release assembly
# (SHA256SUMS.txt, update-manifest.json, GitHub release) stays in the calling workflow.
on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into package.json (semver, e.g. 0.5.87 or 0.5.87-nightly.123)
        required: true
        type: string
      tag:
        description: Release tag the packages will be published under (v<version>)
        required: true
        type: string
      prerelease:
        description: Whether the release is a prerelease
        required: false
        type: boolean
        default: false
      androidVersionCode:
        description: Optional Android versionCode override (nightly builds); empty uses the package.json derivation
        required: false
        type: string
        default: ''
    secrets:
      # Optional Windows Authenticode certificate. Empty values are ignored by electron-builder.
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      # Optional Developer ID certificate and Apple notarization credentials.
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      # Optional Android release keystore (base64 PKCS#12/JKS). Without it the committed CI
      # debug key signs the APK.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ZEN_ANDROID_KEYSTORE_PASSWORD:
        required: false
      ZEN_ANDROID_KEY_ALIAS:
        required: false
      ZEN_ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate package inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check version and tag
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$PACKAGE_VERSION' is not semver"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::tag '$RELEASE_TAG' must be v$PACKAGE_VERSION"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
          - name: Windows x64
            os: windows-2022
            platform: win
          # Both macOS architectures are built in one job on purpose: electron-builder then
          # writes a single latest-mac.yml that lists the x64 and arm64 zips, which the
          # updater needs. Separate jobs would overwrite each other's feed.
          # An Intel runner cross-builds both architectures. The default `macos-15` label
          # points at arm64 runners, which GitHub cancels after long capacity queues ("The job
          # was not acquired by Runner of type hosted"); this job builds x64 and arm64 anyway.
          - name: macOS x64 + arm64
            os: macos-15-intel
            platform: mac
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set the package version
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.PACKAGE_VERSION
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm flatpak flatpak-builder
          # electron-builder's flatpak target installs the runtime, SDK and Electron base
          # app into the per-user flatpak installation, so the remote must exist first.
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-deps --arch=x86_64 flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Build application
        run: bun run build

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: bunx electron-builder --linux --x64 --publish never

      - name: Package Windows
        if: matrix.platform == 'win'
        env:
          # Windows-only certificate secrets. Empty values are ignored by electron-builder's
          # Windows signer, so unsigned builds still work.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: bunx electron-builder --win --x64 --publish never

      - name: Configure macOS signing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export the variables that are actually configured. An empty CSC_LINK makes
          # electron-builder try to import an empty keychain entry instead of skipping signing.
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$CSC_KEY_PASSWORD_SECRET" ]; then
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ]; then
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_TEAM_ID_SECRET" ]; then
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Package macOS
        if: matrix.platform == 'mac'
        shell: bash
        run: bunx electron-builder --mac --x64 --arm64 --publish never

      - name: Stage install.sh
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cp build/linux/install.sh dist/install.sh
          chmod +x dist/install.sh

      - name: Upload Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ione-linux-x64-${{ inputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/install.sh
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux updater feed
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ione-linux-feed-${{ inputs.version }}
          path: |
            dist/latest-linux.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows packages
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ione-windows-x64-${{ inputs.version }}
          path: |
            dist/*-x64-setup.exe
            dist/*-x64.msi
            dist/*-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows updater feed
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ione-windows-feed-${{ inputs.version }}
          path: |
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS packages
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ione-macos-${{ inputs.version }}
          path: |
            dist/*-x64.dmg
            dist/*-arm64.dmg
            dist/*-x64.zip
            dist/*-arm64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS updater feed
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ione-macos-feed-${{ inputs.version }}
          path: |
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set the package version
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.PACKAGE_VERSION
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-android-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-android-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android web bundle
        run: bun run build:android:web

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/ione-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            echo "ZEN_ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          fi

      - name: Package Android APK
        working-directory: android
        shell: bash
        env:
          # Optional release keystore password/alias settings. The keystore itself is decoded
          # into RUNNER_TEMP and pointed at by ZEN_ANDROID_KEYSTORE_FILE in the step above.
          ZEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          ZEN_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          ZEN_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
          # Empty means "derive it from package.json" (stable builds). The nightly caller passes
          # a run-specific code below the same version's stable code, so stable can upgrade a
          # nightly in place while each nightly still outranks the previous one.
          ZEN_ANDROID_VERSION_CODE: ${{ inputs.androidVersionCode }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -PskipWeb

      - name: Stage Android package
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Gradle produced no release APK"
            exit 1
          fi
          cp "$apk" "android/app/build/outputs/apk/release/ione-${PACKAGE_VERSION}.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ione-android-${{ inputs.version }}
          path: android/app/build/outputs/apk/release/ione-*.apk
          if-no-files-found: error
          retention-days: 7
