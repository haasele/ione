appId: dev.ione.browser
productName: Ione
executableName: ione
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - out/main/feed-worker.js
  - node_modules/better-sqlite3/**
  - node_modules/electron-chrome-extensions/**
  - node_modules/electron-chrome-web-store/**
  - node_modules/@ghostery/**
npmRebuild: false
linux:
  target:
    - dir
  category: Network
  icon: build/icon.png
  artifactName: ione-${version}-${arch}.${ext}
